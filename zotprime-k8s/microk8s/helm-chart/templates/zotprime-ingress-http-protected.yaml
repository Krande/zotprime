{{- if .Values.basicAuth.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zotprime-k8s.fullname" . }}-zotprime-ingress-protected
  labels:
    apps: zotprime-ingress-protected
  {{- include "zotprime-k8s.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.tls.enabled }}
    cert-manager.io/cluster-issuer: letsencrypt
    {{- end }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "zotprime-k8s.fullname" . }}-basic-auth@kubernetescrd
spec:
  {{- if .Values.ingressClassName }}
  ingressClassName: {{ .Values.ingressClassName }}
  {{- end }}
  {{- if .Values.tls.enabled }}
  tls:
  - secretName: {{ include "zotprime-k8s.fullname" . }}-tls
    hosts:
    - {{ .Values.ingressHostnames.minios3Web }}
    - {{ .Values.ingressHostnames.phpmyadmin }}
  {{- end }}
  rules:
  - host: {{ .Values.ingressHostnames.minios3Web }}
    http:
      paths:
      - backend:
          service:
            name: minio
            port:
              name: minio-ui
        path: /
        pathType: Prefix
  - host: {{ .Values.ingressHostnames.phpmyadmin }}
    http:
      paths:
      - backend:
          service:
            name: phpmyadmin
            port:
              number: 80
        path: /
        pathType: Prefix
{{- end }}
