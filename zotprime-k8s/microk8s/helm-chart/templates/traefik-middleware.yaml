{{- if .Values.basicAuth.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "zotprime-k8s.fullname" . }}-basic-auth
  labels:
    {{- include "zotprime-k8s.labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ include "zotprime-k8s.fullname" . }}-basic-auth
{{- end }}
